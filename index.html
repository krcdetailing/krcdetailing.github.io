  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

12px; letter-spacing: 0.14em; text-transform: uppercase; color: #86c3ee; margin-bottom: 14px;\">Studio specificaties<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"display: flex; justify-content: space-between; gap: 12px;\"><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #c3cbd6;\">Locatie<\u002Fspan><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">Utrecht, op afspraak<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px;\"><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #c3cbd6;\">Doorlooptijd<\u002Fspan><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">1 – 3 dagen<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px;\"><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #c3cbd6;\">Ophaalservice<\u002Fspan><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">Binnen 20 km<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px;\"><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #c3cbd6;\">Garantie coating<\u002Fspan><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">Tot 5 jaar<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 30px 40px; max-width: 1200px; margin: 0 auto;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; text-align: center;\">\n        <div><div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 6px 16px; border-radius: 8px; font-family: 'Fraunces', serif; font-size: 30px; color: #86c3ee;\">11<\u002Fdiv><div style=\"margin-top: 6px; display: inline-block; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-size: 13px;\">jaar ervaring<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 6px 16px; border-radius: 8px; font-family: 'Fraunces', serif; font-size: 30px; color: #86c3ee;\">640+<\u002Fdiv><div style=\"margin-top: 6px; display: inline-block; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-size: 13px;\">auto's behandeld<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 6px 16px; border-radius: 8px; font-family: 'Fraunces', serif; font-size: 30px; color: #86c3ee;\">4.9<\u002Fdiv><div style=\"margin-top: 6px; display: inline-block; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-size: 13px;\">gemiddelde beoordeling<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 6px 16px; border-radius: 8px; font-family: 'Fraunces', serif; font-size: 30px; color: #86c3ee;\">5j<\u002Fdiv><div style=\"margin-top: 6px; display: inline-block; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-size: 13px;\">coatinggarantie<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"diensten\" style=\"padding: 90px 40px; max-width: 1200px; margin: 0 auto;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; align-items: end; margin-bottom: 48px;\">\n        <div>\n          <div style=\"display: inline-flex; align-items: center; gap: 10px; background: rgba(8,12,18,0.6); padding: 6px 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #86c3ee; margin-bottom: 12px;\">\n            <span style=\"width: 20px; height: 1px; background: #86c3ee; display: inline-block;\"><\u002Fspan>Diensten\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(28px, 3.6vw, 42px); margin: 0;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 12px; border-radius: 8px;\">Drie niveaus van precisie.<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 10px 16px; border-radius: 8px; font-size: 16px; line-height: 1.6; margin: 0;\">Van een grondige onderhoudsbeurt tot volledige paint correction met keramische afwerking — elk pakket wordt op de auto zelf afgestemd, niet op een vaste checklist.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;\">\n        <div style=\"border: 1px solid rgba(10,20,30,0.14); border-radius: 10px; padding: 28px;\">\n          <span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #86c3ee;\">01 — ONDERHOUD<\u002Fspan>\n          <h3 style=\"font-family: 'Fraunces', serif; font-size: 22px; margin: 14px 0 10px;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px;\">Signature Wash<\u002Fspan><\u002Fh3>\n          <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; margin: 0 0 16px;\">Handmatige tweefasen-was, velgenreiniging en interieur detailing voor auto's die er verzorgd bij moeten blijven.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px;\">\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> Contactloze voorwas<\u002Fspan>\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> pH-neutrale shampoo<\u002Fspan>\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> Interieur stofzuigen &amp; leerverzorging<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 12px; border-radius: 6px; font-family: 'Fraunces', serif; font-size: 20px; color: #86c3ee;\">Vanaf € 129<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid rgba(10,20,30,0.14); border-radius: 10px; padding: 28px;\">\n          <span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #86c3ee;\">02 — CORRECTIE<\u002Fspan>\n          <h3 style=\"font-family: 'Fraunces', serif; font-size: 22px; margin: 14px 0 10px;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px;\">Paint Correction<\u002Fspan><\u002Fh3>\n          <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; margin: 0 0 16px;\">Machinale polijstbeurt die swirls, waslicht-krassen en oxidatie verwijdert en de lak terugbrengt naar spiegelglans.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px;\">\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> Lakdiktemeting vooraf<\u002Fspan>\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> Meerfasen polijstproces<\u002Fspan>\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> Fotoverslag voor &amp; na<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 12px; border-radius: 6px; font-family: 'Fraunces', serif; font-size: 20px; color: #86c3ee;\">Vanaf € 449<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid rgba(10,20,30,0.14); border-radius: 10px; padding: 28px;\">\n          <span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #86c3ee;\">03 — BESCHERMING<\u002Fspan>\n          <h3 style=\"font-family: 'Fraunces', serif; font-size: 22px; margin: 14px 0 10px;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px;\">Ceramic Shield<\u002Fspan><\u002Fh3>\n          <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; margin: 0 0 16px;\">Keramische coating die de lak jarenlang beschermt tegen UV, chemicaliën en vuil, met een diepe, natte glans.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px;\">\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> Inclusief paint correction<\u002Fspan>\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> 9H keramische laag<\u002Fspan>\n            <span style=\"display: inline-block; align-self: flex-start; background: rgba(8,12,18,0.55); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\"><span style=\"color: #86c3ee;\">—<\u002Fspan> Onderhoudsplan inbegrepen<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 12px; border-radius: 6px; font-family: 'Fraunces', serif; font-size: 20px; color: #86c3ee;\">Vanaf € 899<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"werkwijze\" style=\"padding: 90px 40px; max-width: 1200px; margin: 0 auto;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; align-items: end; margin-bottom: 48px;\">\n        <div>\n          <div style=\"display: inline-flex; align-items: center; gap: 10px; background: rgba(8,12,18,0.6); padding: 6px 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #86c3ee; margin-bottom: 12px;\">\n            <span style=\"width: 20px; height: 1px; background: #86c3ee; display: inline-block;\"><\u002Fspan>Werkwijze\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(28px, 3.6vw, 42px); margin: 0;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 12px; border-radius: 8px;\">Vier stappen, geen omwegen.<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 10px 16px; border-radius: 8px; font-size: 16px; line-height: 1.6; margin: 0;\">Structuur zonder de studio in een fabriek te veranderen — elke stap bepaalt wat de volgende nodig heeft.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px;\">\n        <div style=\"border-top: 1px solid rgba(10,20,30,0.16); padding-top: 18px;\">\n          <div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #86c3ee; margin-bottom: 10px;\">01<\u002Fdiv>\n          <h3 style=\"font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 8px;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px;\">Inspectie<\u002Fspan><\u002Fh3>\n          <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; margin: 0;\">Lakdiktemeting en een rondje met de klant om doel en verwachting scherp te krijgen.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid rgba(10,20,30,0.16); padding-top: 18px;\">\n          <div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #86c3ee; margin-bottom: 10px;\">02<\u002Fdiv>\n          <h3 style=\"font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 8px;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px;\">Voorbereiding<\u002Fspan><\u002Fh3>\n          <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; margin: 0;\">Decontaminatie van lak en velgen, klei-behandeling en afplakken van kwetsbare delen.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid rgba(10,20,30,0.16); padding-top: 18px;\">\n          <div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #86c3ee; margin-bottom: 10px;\">03<\u002Fdiv>\n          <h3 style=\"font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 8px;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px;\">Behandeling<\u002Fspan><\u002Fh3>\n          <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; margin: 0;\">Polijsten, coaten of reinigen — uitgevoerd in fasen, met controle na elke stap.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid rgba(10,20,30,0.16); padding-top: 18px;\">\n          <div style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #86c3ee; margin-bottom: 10px;\">04<\u002Fdiv>\n          <h3 style=\"font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 8px;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 3px 10px; border-radius: 6px;\">Oplevering<\u002Fspan><\u002Fh3>\n          <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; margin: 0;\">Eindinspectie bij daglicht, fotoverslag en een kort onderhoudsadvies voor thuis.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 80px 40px; max-width: 900px; margin: 0 auto; text-align: center;\">\n      <blockquote style=\"margin: 0 0 20px; font-family: 'Fraunces', serif; font-style: italic; font-size: clamp(20px, 2.8vw, 28px); line-height: 1.4;\">\n        <span style=\"display: inline; background: rgba(8,12,18,0.6); padding: 4px 10px; border-radius: 8px; box-decoration-break: clone; -webkit-box-decoration-break: clone;\">\"Ik heb auto's laten wassen. Bij KRC laat ik ze restaureren — dat is een ander vak.\"<\u002Fspan>\n      <\u002Fblockquote>\n      <div style=\"display: inline-block; background: rgba(8,12,18,0.55); padding: 5px 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #c3cbd6;\">— R. van Dijk, klant sinds 2022<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"padding: 90px 40px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 48px;\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 10px; background: rgba(8,12,18,0.6); padding: 6px 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #86c3ee; margin-bottom: 12px;\">\n          <span style=\"width: 20px; height: 1px; background: #86c3ee; display: inline-block;\"><\u002Fspan>Contact\n        <\u002Fdiv>\n        <h2 style=\"font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(28px, 3.6vw, 42px); margin: 0 0 16px;\"><span style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 4px 12px; border-radius: 8px;\">Plan een afspraak.<\u002Fspan><\u002Fh2>\n        <p style=\"display: inline-block; background: rgba(8,12,18,0.6); padding: 10px 16px; border-radius: 8px; font-size: 16px; line-height: 1.6; margin: 0 0 26px;\">Stuur merk, model en bouwjaar mee — dan komen we voorbereid en kunnen we ter plekke een realistische inschatting geven.<\u002Fp>\n\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"display: flex; justify-content: space-between; gap: 12px;\"><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #c3cbd6;\">Adres<\u002Fspan><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-size: 14px;\">Industrieweg 12, Utrecht<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px;\"><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #c3cbd6;\">Telefoon<\u002Fspan><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-size: 14px;\">030 – 123 4567<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px;\"><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #c3cbd6;\">E-mail<\u002Fspan><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-size: 14px;\">info@krcdetailing.nl<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px;\"><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #c3cbd6;\">Openingstijden<\u002Fspan><span style=\"background: rgba(8,12,18,0.55); padding: 6px 10px; border-radius: 6px; font-size: 14px;\">Di–Za, 09:00–18:00<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ formSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"align-self: start; background: rgba(8,12,18,0.7); border: 1px solid rgba(134,195,238,0.3); border-radius: 10px; padding: 32px; text-align: center;\">\n          <div style=\"font-family: 'Fraunces', serif; font-size: 19px; margin-bottom: 8px; color: #86c3ee;\">Bedankt!<\u002Fdiv>\n          <p style=\"font-size: 14px; margin: 0;\">Je aanvraag is verzonden. We nemen zo snel mogelijk contact met je op.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ formNotSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ handleSubmit }}\" style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(10,20,30,0.18); padding: 8px 0;\">\n            <label style=\"background: rgba(8,12,18,0.55); padding: 5px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; width: 90px; flex-shrink: 0;\">Naam<\u002Flabel>\n            <input type=\"text\" value=\"{{ form.naam }}\" sc-camel-on-change=\"{{ formChangeNaam }}\" style=\"flex: 1; background: rgba(8,12,18,0.4); border: none; border-radius: 6px; padding: 8px 10px; color: #f2f5f8; font-size: 15px; font-family: 'Manrope', sans-serif;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(10,20,30,0.18); padding: 8px 0;\">\n            <label style=\"background: rgba(8,12,18,0.55); padding: 5px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; width: 90px; flex-shrink: 0;\">Auto<\u002Flabel>\n            <input type=\"text\" placeholder=\"Merk, model, bouwjaar\" value=\"{{ form.auto }}\" sc-camel-on-change=\"{{ formChangeAuto }}\" style=\"flex: 1; background: rgba(8,12,18,0.4); border: none; border-radius: 6px; padding: 8px 10px; color: #f2f5f8; font-size: 15px; font-family: 'Manrope', sans-serif;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(10,20,30,0.18); padding: 8px 0;\">\n            <label style=\"background: rgba(8,12,18,0.55); padding: 5px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; width: 90px; flex-shrink: 0;\">E-mail<\u002Flabel>\n            <input type=\"email\" value=\"{{ form.email }}\" sc-camel-on-change=\"{{ formChangeEmail }}\" style=\"flex: 1; background: rgba(8,12,18,0.4); border: none; border-radius: 6px; padding: 8px 10px; color: #f2f5f8; font-size: 15px; font-family: 'Manrope', sans-serif;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid rgba(10,20,30,0.18); padding: 8px 0;\">\n            <label style=\"background: rgba(8,12,18,0.55); padding: 5px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; width: 90px; flex-shrink: 0; margin-top: 2px;\">Bericht<\u002Flabel>\n            <textarea rows=\"3\" value=\"{{ form.bericht }}\" sc-camel-on-change=\"{{ formChangeBericht }}\" style=\"flex: 1; background: rgba(8,12,18,0.4); border: none; border-radius: 6px; padding: 8px 10px; color: #f2f5f8; font-size: 15px; font-family: 'Manrope', sans-serif; resize: vertical;\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"margin-top: 8px; align-self: flex-start; background: #58a6e0; color: #0b1220; font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; padding: 13px 24px; border-radius: 4px; border: none; cursor: pointer;\" style-hover=\"background: #86c3ee;\">Verstuur aanvraag<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n  <\u002Fmain>\n\n  <footer style=\"position: relative; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 30px 40px 50px; max-width: 1200px; margin: 0 auto;\">\n    <div style=\"background: rgba(8,12,18,0.55); padding: 5px 12px; border-radius: 6px; font-size: 13px;\">© 2026 KRC Detailing<\u002Fdiv>\n    <div style=\"display: flex; gap: 14px;\">\n      <a href=\"#top\" style=\"background: rgba(8,12,18,0.55); padding: 5px 12px; border-radius: 6px; font-size: 13px;\" style-hover=\"background: rgba(8,12,18,0.8); color: #86c3ee;\">Instagram<\u002Fa>\n      <a href=\"#top\" style=\"background: rgba(8,12,18,0.55); padding: 5px 12px; border-radius: 6px; font-size: 13px;\" style-hover=\"background: rgba(8,12,18,0.8); color: #86c3ee;\">Privacyverklaring<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    menuOpen: false,\n    windowWidth: typeof window !== 'undefined' ? window.innerWidth : 1200,\n    formSubmitted: false,\n    form: { naam: '', auto: '', email: '', bericht: '' }\n  };\n\n  canvasRef = React.createRef();\n\n  componentDidMount() {\n    this.initWater();\n    this.lastScrollY = window.scrollY;\n    this.handleResize = () => {\n      this.setState({ windowWidth: window.innerWidth });\n      this.resizeCanvas();\n    };\n    this.handleScroll = () => {\n      this.scrollY = window.scrollY;\n    };\n    window.addEventListener('resize', this.handleResize);\n    window.addEventListener('scroll', this.handleScroll, { passive: true });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.handleResize);\n    window.removeEventListener('scroll', this.handleScroll);\n    if (this.rafId) cancelAnimationFrame(this.rafId);\n  }\n\n  initWater() {\n    const canvas = this.canvasRef.current;\n    if (!canvas) return;\n    this.ctx = canvas.getContext('2d');\n    this.time = 0;\n    this.scrollY = window.scrollY || 0;\n    this.resizeCanvas();\n    this.animate();\n  }\n\n  resizeCanvas() {\n    const canvas = this.canvasRef.current;\n    if (!canvas) return;\n    canvas.width = window.innerWidth;\n    canvas.height = window.innerHeight;\n  }\n\n  animate = () => {\n    this.time += 0.016;\n    this.render();\n    this.rafId = requestAnimationFrame(this.animate);\n  };\n\n  render() {\n    const ctx = this.ctx;\n    const canvas = this.canvasRef.current;\n    if (!ctx || !canvas) return;\n    const w = canvas.width, h = canvas.height;\n    const boost = 1;\n    const scrollY = this.scrollY || 0;\n\n    ctx.clearRect(0, 0, w, h);\n    const bg = ctx.createLinearGradient(0, 0, 0, h);\n    bg.addColorStop(0, '#0d2b52');\n    bg.addColorStop(0.35, '#1f5590');\n    bg.addColorStop(0.7, '#4f8fce');\n    bg.addColorStop(1, '#a9d3f0');\n    ctx.fillStyle = bg;\n    ctx.fillRect(0, 0, w, h);\n\n    const blobs = [\n      { rx: 0.28, ry: 0.32, sx: 0.55, sy: 0.4, speed: 0.12, parallax: 0.06, r: Math.max(w, h) * 0.32, color: 'rgba(15,70,130,0.4)' },\n      { rx: 0.42, ry: 0.22, sx: 0.65, sy: 0.7, speed: 0.09, parallax: 0.12, r: Math.max(w, h) * 0.26, color: 'rgba(200,230,250,0.3)' },\n      { rx: 0.2, ry: 0.4, sx: 0.2, sy: 0.6, speed: 0.15, parallax: 0.02, r: Math.max(w, h) * 0.22, color: 'rgba(230,245,255,0.22)' }\n    ];\n    blobs.forEach((b) => {\n      const t = this.time * b.speed * boost;\n      const x = w * b.sx + Math.sin(t) * w * b.rx;\n      const y = ((h * b.sy + Math.cos(t * 0.8) * h * b.ry + scrollY * b.parallax) % (h * 1.6) + h * 1.6) % (h * 1.6) - h * 0.3;\n      const grad = ctx.createRadialGradient(x, y, 0, x, y, b.r);\n      grad.addColorStop(0, b.color);\n      grad.addColorStop(1, 'rgba(20,60,110,0)');\n      ctx.fillStyle = grad;\n      ctx.beginPath();\n      ctx.arc(x, y, b.r, 0, Math.PI * 2);\n      ctx.fill();\n    });\n\n    const waves = [\n      { baseY: h * 0.28, amp: 14, freq: 0.003, speed: 0.5, phase: 0, parallax: 0.04 },\n      { baseY: h * 0.5, amp: 18, freq: 0.0024, speed: 0.38, phase: 2.2, parallax: 0.09 },\n      { baseY: h * 0.72, amp: 22, freq: 0.002, speed: 0.28, phase: 4.4, parallax: 0.16 }\n    ];\n    const step = Math.max(6, Math.floor(w / 160));\n    waves.forEach((wv) => {\n      const amp = wv.amp * boost;\n      const yShift = ((scrollY * wv.parallax) % h + h) % h;\n      ctx.beginPath();\n      for (let x = 0; x <= w; x += step) {\n        const y = wv.baseY + yShift\n          + Math.sin(x * wv.freq + this.time * wv.speed + wv.phase) * amp\n          + Math.sin(x * wv.freq * 2.4 + this.time * wv.speed * 1.6 + wv.phase) * amp * 0.3;\n        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n      }\n      ctx.strokeStyle = 'rgba(210,235,252,0.6)';\n      ctx.lineWidth = 1.5;\n      ctx.shadowBlur = 10;\n      ctx.shadowColor = 'rgba(90,160,220,0.7)';\n      ctx.stroke();\n      ctx.shadowBlur = 0;\n    });\n  }\n\n  toggleMenu = () => this.setState((s) => ({ menuOpen: !s.menuOpen }));\n  closeMenu = () => this.setState({ menuOpen: false });\n\n  handleSubmit = (e) => {\n    e.preventDefault();\n    this.setState({ formSubmitted: true });\n  };\n\n  renderVals() {\n    const isMobile = this.state.windowWidth < 860;\n    const { form } = this.state;\n    return {\n      canvasRef: this.canvasRef,\n      menuOpen: this.state.menuOpen,\n      toggleMenu: this.toggleMenu,\n      closeMenu: this.closeMenu,\n      isMobile,\n      isDesktop: !isMobile,\n      formSubmitted: this.state.formSubmitted,\n      formNotSubmitted: !this.state.formSubmitted,\n      form,\n      formChangeNaam: (e) => this.setState({ form: { ...form, naam: e.target.value } }),\n      formChangeAuto: (e) => this.setState({ form: { ...form, auto: e.target.value } }),\n      formChangeEmail: (e) => this.setState({ form: { ...form, email: e.target.value } }),\n      formChangeBericht: (e) => this.setState({ form: { ...form, bericht: e.target.value } }),\n      handleSubmit: this.handleSubmit\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
